name: spine
description: Spine — a vertical, snap-scrolling feed of books. Five ideas per book, read, listen, or watch.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management — deliberately lightweight.
  provider: ^6.1.2

  # Local persistence. Swappable behind PreferencesStore.
  shared_preferences: ^2.3.2

  # Audio playback.
  just_audio: ^0.9.42
  audio_session: ^0.1.21

  # The daily idea notification. Local only — no server, no push certificates.
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Bridges today's idea into the Android/iOS home-screen widgets.
  home_widget: ^0.7.0

  # Generic OS share sheet — the fallback when Instagram/Facebook Stories
  # aren't installed, or on a platform the native story channel doesn't cover.
  share_plus: ^7.2.2

  # Remote audio caching for the (future) cloud-hosted catalogue.
  path_provider: ^2.1.4
  http: ^1.2.2
  google_mobile_ads: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Used by the design-preview harness to locate the SDK's icon font.
  path: ^1.9.0

  # Branding generators. Run after editing assets/branding:
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# Launcher icon — placeholder mark, generated by tool/generate_branding.py.
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  adaptive_icon_background: "#16140F"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  ios: true
  remove_alpha_ios: true

# Splash: the ribbon on ink, so launch looks like the app rather than a flash
# of white.
flutter_native_splash:
  color: "#16140F"
  image: assets/branding/splash.png
  android_12:
    color: "#16140F"
    image: assets/branding/splash.png
    icon_background_color: "#16140F"
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/content/
    - assets/audio/atomic-habits/
    - assets/story/

  # Fraunces and Inter ship as variable fonts — Flutter maps FontWeight onto the
  # `wght` axis, so one file covers every weight the design uses.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
